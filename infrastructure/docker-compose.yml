services:
  postgres:
    image: postgres:15-alpine
    container_name: ocr_postgres
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-ocr_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ocr_password}
      - POSTGRES_DB=${POSTGRES_DB:-ocr_db}
    volumes:
      - ocr_postgres_data:/var/lib/postgresql/data
    networks:
      - ocr_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ocr_user} -d ${POSTGRES_DB:-ocr_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ocr_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-ocr_redis_secure_pass}
    networks:
      - ocr_network
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-ocr_redis_secure_pass}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: ocr_mailpit
    restart: always
    environment:
      - MP_WEBROOT=/mail/
    expose:
      - "1025" # Internal SMTP server (isolated strictly to internal ocr_network)
      - "8025" # Internal Mail UI (proxied strictly via Nginx /mail/ with admin auth)
    networks:
      - ocr_network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ocr_backend
    restart: always
    env_file:
      - .env
    environment:
      - MAX_FILE_SIZE_MB=10
      - MAX_PDF_MB=50
      - MAX_PDF_PAGES=100
      - ANONYMOUS_DAILY_CONVERSIONS=3
      - FREE_DAILY_CONVERSIONS=3
      - FREE_MAX_FILE_MB=10
      - FREE_MAX_PDF_PAGES=5
      - OCR_TIMEOUT_SECONDS=300
      - MAX_JOBS_PER_IP_PER_HOUR=30
      - CORS_ORIGINS=["http://localhost", "http://localhost:3000", "http://localhost:80"]
      - FRONTEND_URL=http://localhost
      - TEMP_UPLOAD_DIR=/tmp/ocr_uploads
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ocr_user}:${POSTGRES_PASSWORD:-ocr_password}@postgres:5432/${POSTGRES_DB:-ocr_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-ocr_redis_secure_pass}@redis:6379/0
      - INITIAL_ADMIN_EMAIL=${INITIAL_ADMIN_EMAIL:-}
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-sk_test_placeholder_key}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-pk_test_placeholder_key}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-whsec_placeholder_secret}
      - STRIPE_PRO_MONTHLY_PRICE_ID=${STRIPE_PRO_MONTHLY_PRICE_ID:-price_ocr_pro_monthly_test}
      - PRO_DAILY_CONVERSIONS=100
      - PRO_MAX_FILE_MB=50
      - PRO_MAX_PDF_PAGES=100
    volumes:
      - ocr_temp_data:/tmp/ocr_uploads
    networks:
      - ocr_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8000/health || python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ocr_worker
    restart: always
    command: celery -A app.worker.celery_app.celery_app worker --loglevel=info -c 4
    environment:
      - MAX_FILE_SIZE_MB=10
      - MAX_PDF_MB=50
      - MAX_PDF_PAGES=100
      - ANONYMOUS_DAILY_CONVERSIONS=3
      - FREE_DAILY_CONVERSIONS=3
      - FREE_MAX_FILE_MB=10
      - FREE_MAX_PDF_PAGES=5
      - OCR_TIMEOUT_SECONDS=300
      - TEMP_UPLOAD_DIR=/tmp/ocr_uploads
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ocr_user}:${POSTGRES_PASSWORD:-ocr_password}@postgres:5432/${POSTGRES_DB:-ocr_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-ocr_redis_secure_pass}@redis:6379/0
    volumes:
      - ocr_temp_data:/tmp/ocr_uploads
    networks:
      - ocr_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ocr_beat
    restart: always
    command: celery -A app.worker.celery_app.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ocr_user}:${POSTGRES_PASSWORD:-ocr_password}@postgres:5432/${POSTGRES_DB:-ocr_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-ocr_redis_secure_pass}@redis:6379/0
      - TEMP_UPLOAD_DIR=/tmp/ocr_uploads
    volumes:
      - ocr_temp_data:/tmp/ocr_uploads
    networks:
      - ocr_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: ocr_frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=
      - HOSTNAME=0.0.0.0
      - PORT=3000
    networks:
      - ocr_network
    depends_on:
      - backend

  proxy:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: ocr_proxy
    restart: always
    ports:
      - "80:80"
    networks:
      - ocr_network
    depends_on:
      - backend
      - frontend

volumes:
  ocr_temp_data:
  ocr_postgres_data:

networks:
  ocr_network:
    driver: bridge
