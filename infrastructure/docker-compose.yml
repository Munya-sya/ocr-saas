version: '3.8'

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ocr_backend
    restart: always
    environment:
      - MAX_FILE_SIZE_MB=10
      - CORS_ORIGINS=["http://localhost", "http://localhost:3000", "http://localhost:80"]
      - TEMP_DIR=/tmp/ocr_uploads
    volumes:
      - ocr_temp_data:/tmp/ocr_uploads
    networks:
      - ocr_network
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: ocr_frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=
    networks:
      - ocr_network
    depends_on:
      - backend

  proxy:
    image: nginx:alpine
    container_name: ocr_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - ocr_network
    depends_on:
      - backend
      - frontend

volumes:
  ocr_temp_data:

networks:
  ocr_network:
    driver: bridge
