services:
  vault:
    image: hashicorp/vault:1.15.6
    container_name: ocr_vault
    restart: always
    cap_add:
      - IPC_LOCK
    command: server -config=/vault/config/vault.hcl
    environment:
      - VAULT_ADDR=https://127.0.0.1:8200
      - VAULT_API_ADDR=https://vault:8200
      - VAULT_CACERT=/vault/certs/ca.crt
    volumes:
      - ./vault/config/vault.hcl:/vault/config/vault.hcl:ro
      - ./vault/policies:/vault/policies:ro
      - ./vault/scripts:/vault/scripts:ro
      - ./vault/certs:/vault/certs:ro
      - ocr_vault_data:/vault/data
      - ocr_vault_logs:/vault/logs
    networks:
      - ocr_network
    ports:
      - "127.0.0.1:8200:8200"
    healthcheck:
      test: [ "CMD-SHELL", "vault status > /dev/null 2>&1 || [ $$? -eq 2 ]" ]
      interval: 15s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15-alpine
    container_name: ocr_postgres
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-ocr_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ocr_password}
      - POSTGRES_DB=${POSTGRES_DB:-ocr_db}
    volumes:
      - ocr_postgres_data:/var/lib/postgresql/data
    networks:
      - ocr_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ocr_user} -d ${POSTGRES_DB:-ocr_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ocr_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-ocr_redis_secure_pass}
    volumes:
      - ocr_redis_data:/data
    networks:
      - ocr_network
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-ocr_redis_secure_pass}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.15
    container_name: ocr_mailpit
    restart: always
    environment:
      - MP_WEBROOT=/mail/
    expose:
      - "1025" # Internal SMTP server isolated strictly to internal ocr_network
      - "8025" # Internal Mail UI proxied strictly via Nginx /mail/
    networks:
      - ocr_network

volumes:
  ocr_vault_data:
  ocr_vault_logs:
  ocr_postgres_data:
  ocr_redis_data:

networks:
  ocr_network:
    name: ocr_network
    driver: bridge
