name: CI/CD ARM64 Remote Build & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      publish_images:
        description: "Force publish images to GHCR"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Backend & Security Tests (No Prod Secrets)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies (Tesseract & Poppler)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng poppler-utils libgl1

      - name: Install Python Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run Test Suite
        env:
          ENVIRONMENT: test
          JWT_SECRET: ci_test_ephemeral_jwt_secret_key_32_chars_minimum
          DATABASE_URL: sqlite:///./ci_test.db
          REDIS_URL: redis://localhost:6379/0
          PYTHONPATH: backend
        run: |
          python -m pytest backend/tests/ -v

  build-and-push-arm64:
    name: Remote ARM64 Container Builds
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU (ARM64 Emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Immutable Tags
        id: meta
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "owner=${REPO_OWNER}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            echo "version_tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          else
            echo "version_tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Build & Push Backend ARM64 Image
        id: build_backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/ocr-saas/backend:${{ steps.meta.outputs.short_sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/ocr-saas/backend:${{ steps.meta.outputs.version_tag }}

      - name: Build & Push Frontend ARM64 Image
        id: build_frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/ocr-saas/frontend:${{ steps.meta.outputs.short_sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/ocr-saas/frontend:${{ steps.meta.outputs.version_tag }}

      - name: Build & Push Proxy ARM64 Image
        id: build_proxy
        uses: docker/build-push-action@v5
        with:
          context: ./infrastructure/nginx
          file: ./infrastructure/nginx/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/ocr-saas/proxy:${{ steps.meta.outputs.short_sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/ocr-saas/proxy:${{ steps.meta.outputs.version_tag }}

      - name: Generate Release Manifest with Immutable Image Digests
        run: |
          mkdir -p release-artifacts
          cat <<EOF > release-artifacts/release-manifest.json
          {
            "commit_sha": "${{ github.sha }}",
            "short_sha": "${{ steps.meta.outputs.short_sha }}",
            "tag": "${{ steps.meta.outputs.version_tag }}",
            "timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "backend_digest": "${{ steps.build_backend.outputs.digest }}",
            "frontend_digest": "${{ steps.build_frontend.outputs.digest }}",
            "proxy_digest": "${{ steps.build_proxy.outputs.digest }}"
          }
          EOF
          cat release-artifacts/release-manifest.json

      - name: Upload Release Manifest Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ steps.meta.outputs.short_sha }}
          path: release-artifacts/release-manifest.json
