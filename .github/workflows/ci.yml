name: CI - Code Quality & Security Gate

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Leak Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify No Committed Secrets
        run: |
          echo "Scanning repository for stray .env files or exposed private keys..."
          if find . -maxdepth 3 -name ".env" ! -name ".env.example" | grep -q .; then
            echo "ERROR: Unencrypted .env file found in commit!"
            exit 1
          fi
          echo "No committed .env files found."

  frontend-check:
    name: Frontend Lint & Standalone Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint & Typecheck
        working-directory: ./frontend
        run: npm run lint

      - name: Test Next.js Production Standalone Build
        working-directory: ./frontend
        run: npm run build

  backend-tests:
    name: Backend Unit, Security & Vault Config Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies (Tesseract OCR & Poppler)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr \
            tesseract-ocr-eng \
            poppler-utils \
            libgl1

      - name: Install Python Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run Pytest Suite
        env:
          ENVIRONMENT: test
          JWT_SECRET: ephemeral_ci_test_jwt_secret_must_be_32_characters_long
          DATABASE_URL: sqlite:///./ci_test.db
          REDIS_URL: redis://localhost:6379/0
          PYTHONPATH: backend
        run: |
          python -m pytest backend/tests/ -v
